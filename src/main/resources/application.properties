spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ksfx?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=
spring.datasource.password=
spring.session.timeout=24h
server.servlet.session.timeout=24h
server.forward-headers-strategy=native
# Spring's default is 1MB per file / 10MB per request - too small for the documents (PPTX, PDF)
# meant to go into agent workspaces via the Agentic file browser (chat attachments benefit too).
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB