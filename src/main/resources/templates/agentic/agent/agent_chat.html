<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title th:text="'KSFX - Chat - ' + ${agent.name}">KSFX - Chat</title>
</head>
<body>
<!-- layout :: site-head above discards all of <head>'s own children (th:replace swaps the whole
     element), so page-specific CSS can't live there - it's linked here in <body> instead, which
     HTML5 permits and keeps this file self-contained without touching layout.html. -->
<link rel="stylesheet" th:href="@{/styles/agentic-chat.css}" />
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/agentic/}">Agentic</a></li>
        <li class="breadcrumb-item active" th:text="${agent.name}">Agent</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div class="agentic-layout" th:classappend="${#session?.getAttribute('ksfxdisplaymode') == 'dark'} ? ' agentic-dark' : ''">

    <aside class="agentic-sidebar" th:data-status-endpoint="@{/agentic/status}"
           th:data-csrf-header="${_csrf.headerName}" th:data-csrf-token="${_csrf.token}">
        <div class="agentic-sidebar-header">
            <span>Agents</span>
            <a th:href="@{/agentic/edit}" class="agentic-sidebar-new" title="New Agent" aria-label="New Agent"><i class="fa fa-plus"></i></a>
        </div>
        <div class="agentic-sidebar-list">
            <div th:each="p : ${allAgenticProjects}" class="agentic-sidebar-project">
                <div class="agentic-sidebar-project-name" th:text="${p.name}"></div>
                <div th:each="a : ${agentsByAgenticProject[p.id]}"
                     th:data-agent-id="${a.id}"
                     class="agentic-sidebar-item" th:classappend="${a.id == agent.id} ? ' agentic-sidebar-item--active' : ''">
                    <span class="agentic-sidebar-item-status" title=""></span>
                    <a th:href="@{/agentic/chat/{id}(id=${a.id})}" class="agentic-sidebar-item-link">
                        <span class="agentic-sidebar-item-text">
                            <span class="agentic-sidebar-item-name" th:text="${a.name}"></span>
                            <span th:if="${not #strings.isEmpty(a.description)}" class="agentic-sidebar-item-description" th:text="${a.description}"></span>
                        </span>
                        <span th:unless="${a.enabled}" class="agentic-sidebar-item-badge">off</span>
                    </a>
                    <button type="button" class="agentic-sidebar-item-icon agentic-sidebar-item-stop" th:data-stop-endpoint="@{/agentic/chat/{id}/stop(id=${a.id})}" title="Stop" aria-label="Stop"><i class="fa fa-stop"></i></button>
                    <span class="agentic-sidebar-item-actions">
                        <a th:href="@{/agentic/schedule/{id}/(id=${a.id})}" class="agentic-sidebar-item-icon" title="Schedules" aria-label="Schedules"><i class="fa fa-clock-o"></i></a>
                        <a th:href="@{/agentic/edit/{id}(id=${a.id})}" class="agentic-sidebar-item-icon" title="Edit Agent" aria-label="Edit Agent"><i class="fa fa-pencil"></i></a>
                    </span>
                </div>
            </div>
            <div th:if="${not #lists.isEmpty(unassignedAgents)}" class="agentic-sidebar-project">
                <div class="agentic-sidebar-project-name">Ungrouped</div>
                <div th:each="a : ${unassignedAgents}"
                     th:data-agent-id="${a.id}"
                     class="agentic-sidebar-item" th:classappend="${a.id == agent.id} ? ' agentic-sidebar-item--active' : ''">
                    <span class="agentic-sidebar-item-status" title=""></span>
                    <a th:href="@{/agentic/chat/{id}(id=${a.id})}" class="agentic-sidebar-item-link">
                        <span class="agentic-sidebar-item-text">
                            <span class="agentic-sidebar-item-name" th:text="${a.name}"></span>
                            <span th:if="${not #strings.isEmpty(a.description)}" class="agentic-sidebar-item-description" th:text="${a.description}"></span>
                        </span>
                        <span th:unless="${a.enabled}" class="agentic-sidebar-item-badge">off</span>
                    </a>
                    <button type="button" class="agentic-sidebar-item-icon agentic-sidebar-item-stop" th:data-stop-endpoint="@{/agentic/chat/{id}/stop(id=${a.id})}" title="Stop" aria-label="Stop"><i class="fa fa-stop"></i></button>
                    <span class="agentic-sidebar-item-actions">
                        <a th:href="@{/agentic/schedule/{id}/(id=${a.id})}" class="agentic-sidebar-item-icon" title="Schedules" aria-label="Schedules"><i class="fa fa-clock-o"></i></a>
                        <a th:href="@{/agentic/edit/{id}(id=${a.id})}" class="agentic-sidebar-item-icon" title="Edit Agent" aria-label="Edit Agent"><i class="fa fa-pencil"></i></a>
                    </span>
                </div>
            </div>
        </div>
        <div class="agentic-sidebar-footer">
            <a th:href="@{/agentic/projects/}" title="Agentic Projects"><i class="fa fa-folder"></i> Projects</a>
            <a th:href="@{/agentic/config/}" title="Agentic Settings"><i class="fa fa-cog"></i> Settings</a>
        </div>
    </aside>

    <div class="agentic-main">
        <div class="agentic-toolbar">
            <span class="agentic-main-title" th:text="${agent.name}">Agent</span>
        </div>

        <div id="agenticChatRoot" class="agentic-chat-wrapper"
             th:data-agent-id="${agent.id}"
             th:data-chat-endpoint="@{/agentic/chat/{id}(id=${agent.id})}"
             th:data-stream-endpoint="@{/agentic/chat/{id}/stream(id=${agent.id})}"
             th:data-agent-running="${agentRunning}"
             th:data-download-endpoint="@{/agentic/download/{id}(id=${agent.id})}"
             th:data-csrf-header="${_csrf.headerName}"
             th:data-csrf-token="${_csrf.token}">

            <div id="agenticMessages" class="agentic-messages">
                <div th:each="m : ${messages}" class="agentic-msg" th:classappend="'agentic-msg--' + ${#strings.toLowerCase(m.role.name())}" th:data-message-id="${m.id}">
                    <div class="agentic-msg-header">
                        <div class="agentic-role-label" th:switch="${m.role.name()}">
                            <span th:case="'USER'">You</span>
                            <span th:case="'SYSTEM'">System</span>
                            <span th:case="'AGENT'" th:text="${m.fromAgent != null ? 'Agent: ' + m.fromAgent.name : 'Agent'}"></span>
                            <span th:case="*">Assistant</span>
                        </div>
                        <button type="button" class="agentic-msg-delete" th:attr="data-delete-endpoint=@{/agentic/chat/{id}/message/{messageId}/delete(id=${agent.id},messageId=${m.id})}" title="Delete" aria-label="Delete"><i class="fa fa-trash-o"></i></button>
                    </div>
                    <div class="agentic-bubble" th:text="${m.content}"></div>
                    <div th:if="${m.attachments}" class="agentic-attachments" th:data-attachments="${m.attachments}"></div>
                    <div th:if="${m.generatedFiles}" class="agentic-generated-files" th:data-generated-files="${m.generatedFiles}"></div>
                    <details th:if="${m.toolActivity}" class="agentic-tool-activity">
                        <summary><i class="fa fa-wrench"></i> Tool Activity</summary>
                        <div class="agentic-tool-activity-body" th:data-tool-activity="${m.toolActivity}"></div>
                    </details>
                    <div th:if="${m.inputTokens != null}" class="agentic-message-tokens" th:text="${m.inputTokens + m.outputTokens} + ' tokens'"></div>
                </div>

                <!-- A turn still in flight when this page loaded (e.g. navigated away mid-turn and
                     back, or a schedule/other-agent-triggered turn happening while you're looking at
                     this agent) hasn't persisted an AgentMessage yet - see AgentController.chat()'s
                     partialText/partialToolActivity. Rendered the same shape as a real assistant
                     message so agentic-chat.js's existing history-hydration/tool-activity rendering
                     picks it up unchanged; the script then attaches an EventSource to keep appending
                     to it live and shows the busy indicator, exactly as if this page had started the
                     turn itself. -->
                <div th:if="${agentRunning}" id="agenticInProgressMessage" class="agentic-msg agentic-msg--assistant">
                    <div class="agentic-role-label">Assistant</div>
                    <div class="agentic-bubble" th:text="${partialText}"></div>
                    <details th:if="${partialToolActivity}" class="agentic-tool-activity">
                        <summary><i class="fa fa-wrench"></i> Tool Activity</summary>
                        <div class="agentic-tool-activity-body" th:data-tool-activity="${partialToolActivity}"></div>
                    </details>
                </div>
            </div>

            <div id="agenticPendingFiles" class="agentic-pending-files"></div>
            <div class="agentic-composer">
                <button id="agenticAttachBtn" type="button" class="agentic-attach-btn" title="Attach file" aria-label="Attach file">
                    <i class="fa fa-paperclip"></i>
                </button>
                <input id="agenticFileInput" type="file" multiple hidden="hidden" />
                <textarea id="agenticInput" rows="1" placeholder="Message to the agent... (Enter to send, Shift+Enter for new line)"></textarea>
                <button id="agenticSendBtn" type="button" class="agentic-send-btn" title="Send" aria-label="Send">
                    <i class="fa fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<footer th:replace="layout :: site-footer" />
<script th:src="@{/script/agentic-chat.js}"></script>
</body>
</html>
