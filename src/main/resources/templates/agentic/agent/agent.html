<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title>KSFX - Agentic</title>
</head>
<body>
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item active">Agentic</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div th:replace="components/pagination :: pagination(path='/agentic/', page=${agentsPage})"></div>
<div style="float:right">
    <a th:href="@{/agentic/projects/}" class="fa fa-folder fa-2x" title="Agentic Projects" alt="Agentic Projects"></a>&nbsp;&nbsp;&nbsp;
    <a th:href="@{/agentic/config/}" class="fa fa-cog fa-2x" title="Agentic Config" alt="Agentic Config"></a>&nbsp;&nbsp;&nbsp;
    <a th:href="@{/agentic/edit}" class="fa fa-plus fa-2x" title="Add New Agent" alt="Add New Agent"></a>&nbsp;&nbsp;&nbsp;
</div>
<table class="table table-striped table-responsive-md">
    <thead>
    <header th:replace="components/sortable_table_header :: tableheader(headers=${ {'id','name','description','agenticProject','enabled','chat','edit','delete'} },sortables=${ {'id','name'} },names=${ {'ID','Name','Description','Agentic Project','Enabled','Chat','Edit','Delete'} },page=${agentsPage},path='/agentic/')" />
    </thead>
    <tbody>
    <tr th:each="agent : ${agentsPage.content}">
        <td th:text="${agent.id}"></td>
        <td th:text="${agent.name}"></td>
        <td th:text="${agent.description}"></td>
        <td><a th:if="${agent.agenticProject}" th:href="@{/agentic/projects/edit/{id}(id=${agent.agenticProject.id})}" th:text="${agent.agenticProject.name}"></a></td>
        <td th:text="${agent.enabled} ? 'Yes' : 'No'"></td>
        <td><a th:href="@{/agentic/chat/{id}(id=${agent.id})}" class="fa fa-comments" alt="Chat" title="Chat"></a></td>
        <td><a th:href="@{/agentic/edit/{id}(id=${agent.id})}" class="fa fa-pencil" alt="Edit" title="Edit"></a></td>
        <td><a th:attr="data-href=@{/agentic/delete/{id}(id=${agent.id})}" data-toggle="modal" data-target="#standard-confirm" class="fa fa-trash-o" alt="Delete" title="Delete"></a></td>
    </tr>
    </tbody>
</table>

<footer th:replace="layout :: site-footer" />
</body>
</html>
