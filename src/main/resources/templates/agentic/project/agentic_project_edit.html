<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title>KSFX - Edit Agentic Project</title>
</head>
<body>
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/agentic/}">Agentic</a></li>
        <li class="breadcrumb-item"><a th:href="@{/agentic/projects/}">Agentic Projects</a></li>
        <li class="breadcrumb-item active">Edit Agentic Project</li>
    </ol>
</nav>

<div class="container">
 <div class="list-group">
 <div class="list-group-item">
        <form id="agenticProjectForm" action="#" th:action="@{/agentic/projects/edit}" th:object="${agenticProject}" method="post">
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label for="name">Name</label>
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name not valid</div>
                <input type="text" class="form-control" id="name" th:field="*{name}" />
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" class="form-control" id="description" th:field="*{description}" />
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
            <a th:href="@{/agentic/projects/}" id="cancel" name="cancel" class="btn btn-danger">Cancel</a>
        </form>
</div>
</div>
</div>

<footer th:replace="layout :: site-footer" />
</body>
</html>
