<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title>KSFX - Profile</title>
</head>
<body>
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li th:replace="layout :: project-crumb"></li>
        <li class="breadcrumb-item" th:text="${user.username}">User</li>
        <li class="breadcrumb-item active">Profile</li>
    </ol>
</nav>
<message th:replace="layout :: message"/>

<div class="container">

    <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert">Error</div>
    <div th:if="${success}" th:text="${success}" class="alert alert-success" role="alert">Success</div>

    <div class="list-group">
        <div class="list-group-item">
            <form id="profileForm" action="#" th:action="@{/user/profile}" method="post">
                <div class="form-group">
                    <label for="username">Login name</label>
                    <input type="text" class="form-control" id="username" th:value="${user.username}" disabled="disabled" />
                    <small class="form-text text-muted">The login name is managed by an administrator (User Management).</small>
                </div>
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" th:value="${user.firstName}" />
                </div>
                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" th:value="${user.lastName}" />
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" th:value="${user.email}" />
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>
</div>

<footer th:replace="layout :: site-footer" />
</body>
</html>
