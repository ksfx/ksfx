<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head">
    <title th:text="'KSFX - Wiki - ' + ${page.title}">KSFX - Wiki</title>
</head>
<body>
<link rel="stylesheet" th:href="@{/styles/wiki.css}" />
<header th:replace="layout :: site-header"/>
<!-- Ancestor chain (root-first) between the wiki name and the current page - always the same
     folder as the page itself (see WikiService#validateParentPage), so unlike a folder path this
     never needs reconciling against anything else. Absent (empty ${ancestors}) for a top-level
     page, same as before this feature. -->
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/wiki/{wikiId}/(wikiId=${currentWiki.id})}" th:text="${currentWiki.name}">Wiki</a></li>
        <li class="breadcrumb-item" th:each="ancestor : ${ancestors}">
            <a th:href="@{/wiki/{wikiId}/page/{pageId}(wikiId=${currentWiki.id},pageId=${ancestor.id})}" th:text="${ancestor.title}">Ancestor</a>
        </li>
        <li class="breadcrumb-item active" th:text="${page.title}">Page</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div class="wiki-layout" th:classappend="${#session?.getAttribute('ksfxdisplaymode') == 'dark'} ? ' wiki-dark' : ''">
    <div th:replace="wiki/wiki_tree :: sidebar"></div>

    <div class="wiki-main">
        <div class="wiki-page-toolbar">
            <h1 class="wiki-page-title">
                <span th:text="${page.title}">Title</span>
                <!-- Copies a ready-to-paste, id-based markdown link (survives renames/moves) -
                     handy for linking from OUTSIDE this wiki too (issues, chat). Within wiki pages,
                     [[Title]] wikilinks are usually the nicer choice - see wiki.js. -->
                <button type="button" id="wikiCopyLinkBtn" class="wiki-copylink-btn" title="Copy markdown link to this page" aria-label="Copy link"
                        th:data-markdown-link="'[' + ${page.title} + '](/wiki/' + ${currentWiki.id} + '/page/' + ${page.id} + ')'"><i class="fa fa-link"></i></button>
            </h1>
            <span class="wiki-page-actions">
                <a th:href="@{/wiki/{wikiId}/page/{pageId}/edit(wikiId=${currentWiki.id},pageId=${page.id})}" class="wiki-btn"><i class="fa fa-pencil"></i> Edit</a>
                <a th:href="@{/wiki/{wikiId}/page/{pageId}/history(wikiId=${currentWiki.id},pageId=${page.id})}" class="wiki-btn"><i class="fa fa-history"></i> History</a>
                <!-- parent_page_id is ON DELETE CASCADE (same as folder deletes already cascade to
                     everything underneath) - deleting a page takes its WHOLE subtree (children,
                     grandchildren, ...) with it, so the confirm() says so with the real recursive
                     count whenever there's actually something to lose. -->
                <form th:action="@{/wiki/{wikiId}/page/{pageId}/delete(wikiId=${currentWiki.id},pageId=${page.id})}" method="post" class="wiki-inline-form"
                      th:attr="onsubmit=${descendantCount == 0} ? 'return confirm(\'Delete this page and its whole history?\');' : 'return confirm(\'Delete this page, its whole history, AND all ' + ${descendantCount} + ' of its subpages (and theirs)? This cannot be undone.\');'">
                    <button type="submit" class="wiki-btn wiki-btn-danger"><i class="fa fa-trash-o"></i> Delete</button>
                </form>
            </span>
        </div>
        <div class="wiki-page-meta">
            <span th:if="${version != null and version.editedByAgent != null}">Last edited by agent <strong th:text="${version.editedByAgent.name}"></strong></span>
            <span th:if="${version != null and version.editedByUser != null}">Last edited by <strong th:text="${version.editedByUser.username}"></strong></span>
            <span th:if="${version != null}" th:text="' on ' + ${#dates.format(version.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
        </div>

        <textarea id="wikiPageMarkdown" hidden="hidden" th:text="${renderedContent}"></textarea>
        <div id="wikiPageViewer" class="wiki-page-content"
             th:data-toastui-js="@{/vendor/toastui-editor/toastui-editor.min.js}"
             th:data-toastui-css="@{/vendor/toastui-editor/toastui-editor.css}"></div>

        <!-- Direct children only, same one-level scope as the tree's per-page nesting - a "table of
             contents" for this page, not the full recursive subtree (that's what the tree sidebar
             is for). "New subpage" pre-fills both the folder and the parent (see
             WikiController#newPage), so creating one is a single click from here. -->
        <div class="wiki-subpages" th:if="${not #lists.isEmpty(childPages)}">
            <div class="wiki-subpages-header">
                <span class="wiki-subpages-title"><i class="fa fa-sitemap"></i> Subpages</span>
                <a th:href="@{/wiki/{wikiId}/page/new(wikiId=${currentWiki.id},parentPageId=${page.id})}" class="wiki-btn"><i class="fa fa-plus"></i> New subpage</a>
            </div>
            <ul class="wiki-subpages-list">
                <li th:each="child : ${childPages}">
                    <a th:href="@{/wiki/{wikiId}/page/{pageId}(wikiId=${currentWiki.id},pageId=${child.id})}"><i class="fa fa-file-text-o"></i> <span th:text="${child.title}"></span></a>
                </li>
            </ul>
        </div>

        <div class="wiki-attachments">
            <div class="wiki-attachments-header">
                <span class="wiki-attachments-title"><i class="fa fa-paperclip"></i> Attachments</span>
                <!-- No separate upload button: picking files IS the upload (wiki.js submits this
                     form on the input's change event), one click less for the common case. -->
                <form th:action="@{/wiki/{wikiId}/page/{pageId}/attachment/upload(wikiId=${currentWiki.id},pageId=${page.id})}"
                      method="post" enctype="multipart/form-data" class="wiki-inline-form">
                    <label class="wiki-btn wiki-attachments-upload-label">
                        <i class="fa fa-upload"></i> Upload
                        <input type="file" id="wikiAttachmentInput" name="files" multiple="multiple" hidden="hidden" />
                    </label>
                </form>
            </div>
            <p class="wiki-attachments-empty" th:if="${#lists.isEmpty(attachments)}">No attachments.</p>
            <ul class="wiki-attachments-list" th:unless="${#lists.isEmpty(attachments)}">
                <li th:each="a : ${attachments}" class="wiki-attachment-item">
                    <a th:href="@{/wiki/assets/{id}(id=${a.id})}" class="wiki-attachment-link" target="_blank">
                        <i class="fa fa-file-o"></i> <span th:text="${a.fileName}"></span>
                    </a>
                    <span class="wiki-attachment-meta">
                        <span th:if="${a.fileSize != null}"
                              th:text="${a.fileSize < 1024 ? a.fileSize + ' B' : (a.fileSize < 1048576 ? #numbers.formatDecimal(a.fileSize / 1024.0, 1, 1) + ' KB' : #numbers.formatDecimal(a.fileSize / 1048576.0, 1, 1) + ' MB')}"></span>
                        <span th:if="${a.uploadedByAgent != null}" th:text="'agent ' + ${a.uploadedByAgent.name}"></span>
                        <span th:if="${a.uploadedByUser != null}" th:text="${a.uploadedByUser.username}"></span>
                        <span th:text="${#dates.format(a.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </span>
                    <!-- confirm() lives in wiki.js (delegated submit listener keyed on the class +
                         data-filename) rather than an inline onsubmit - a filename containing
                         quotes would break inline-generated JS. -->
                    <form th:action="@{/wiki/{wikiId}/page/{pageId}/attachment/{assetId}/delete(wikiId=${currentWiki.id},pageId=${page.id},assetId=${a.id})}"
                          method="post" class="wiki-inline-form wiki-attachment-delete-form" th:data-filename="${a.fileName}">
                        <button type="submit" class="wiki-attachment-delete" title="Delete" aria-label="Delete"><i class="fa fa-trash-o"></i></button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>

<footer th:replace="layout :: site-footer" />
<script th:src="@{/script/wiki.js}"></script>
</body>
</html>
