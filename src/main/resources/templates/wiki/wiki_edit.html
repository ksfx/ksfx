<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head">
    <title th:text="${isNew} ? 'KSFX - Wiki - New page' : 'KSFX - Wiki - Edit ' + ${title}">KSFX - Wiki</title>
</head>
<body>
<link rel="stylesheet" th:href="@{/styles/wiki.css}" />
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li th:replace="layout :: project-crumb"></li>
        <li class="breadcrumb-item"><a th:href="@{/wiki/{wikiId}/(wikiId=${currentWiki.id})}" th:text="${currentWiki.name}">Wiki</a></li>
        <li class="breadcrumb-item active" th:text="${isNew} ? 'New page' : 'Edit'">Edit</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div class="wiki-layout" th:classappend="${#session?.getAttribute('ksfxdisplaymode') == 'dark'} ? ' wiki-dark' : ''">
    <div th:replace="wiki/wiki_tree :: sidebar"></div>

    <div class="wiki-main">
        <form id="wikiEditForm" th:action="@{/wiki/{wikiId}/page/save(wikiId=${currentWiki.id})}" method="post" onsubmit="return false;">
            <input type="hidden" name="pageId" th:if="${pageId != null}" th:value="${pageId}" />

            <!-- New page: the target folder is already decided by which "new page" button was
                 clicked (a folder's row action, or the header's root-level one) - it rides along as
                 a hidden field instead of asking again. When EDITING, moving is possible but rare,
                 so it hides behind the small "Move to another folder" link below the editor (see
                 wiki.js) instead of a permanently visible form field. -->
            <input type="hidden" name="folderId" th:if="${isNew}" th:value="${folderId}" />

            <div class="wiki-edit-fields">
                <div class="wiki-field">
                    <label for="wikiEditTitle">Title</label>
                    <input type="text" id="wikiEditTitle" name="title" th:value="${title}" required="required" autofocus="autofocus" />
                </div>
                <!-- Options are always scoped to the page's current folder (see
                     WikiController#pagesInFolder) - a subpage's parent can never be in a different
                     folder (WikiService#validateParentPage), so this never needs to react to the
                     "Move to another folder" select below; if that's used, a stale parent choice
                     just gets caught by that same check on save, same as any other validation
                     error here. -->
                <div class="wiki-field" th:if="${not #lists.isEmpty(parentPageOptions)}">
                    <label for="wikiEditParentPage">Parent page</label>
                    <select id="wikiEditParentPage" name="parentPageId">
                        <option value="">(none - top level of this folder)</option>
                        <option th:each="p : ${parentPageOptions}" th:value="${p.id}" th:text="${p.title}"
                                th:selected="${parentPageId != null and p.id == parentPageId}"></option>
                    </select>
                </div>
            </div>
            <p class="wiki-edit-hint" th:if="${isNew}">The page's filename is generated automatically from the title.</p>

            <!-- One editor for both: Milkdown (wiki-collab.js). Existing pages are edited live
                 together (WikiCollabService); a new page is written alone until its first save -
                 it gets a live session once it exists (a session hangs on the page id). -->
            <div th:if="${!isNew}" class="wiki-collab-bar" id="wikiCollabBar">
                <span class="wiki-collab-status" id="wikiCollabStatus">connecting…</span>
                <span class="wiki-collab-people" id="wikiCollabPeople"></span>
            </div>
            <div class="wiki-collab-toolbar" id="wikiCollabToolbar">
                <button type="button" data-cmd="h1" title="Heading 1">H1</button>
                <button type="button" data-cmd="h2" title="Heading 2">H2</button>
                <button type="button" data-cmd="h3" title="Heading 3">H3</button>
                <button type="button" data-cmd="paragraph" title="Normal text">¶</button>
                <span class="sep"></span>
                <button type="button" data-cmd="bold" title="Bold"><i class="fa fa-bold"></i></button>
                <button type="button" data-cmd="italic" title="Italic"><i class="fa fa-italic"></i></button>
                <button type="button" data-cmd="strike" title="Strikethrough"><i class="fa fa-strikethrough"></i></button>
                <button type="button" data-cmd="code" title="Inline code"><i class="fa fa-code"></i></button>
                <button type="button" data-cmd="link" title="Link"><i class="fa fa-link"></i></button>
                <span class="sep"></span>
                <button type="button" data-cmd="bullet" title="Bullet list"><i class="fa fa-list-ul"></i></button>
                <button type="button" data-cmd="ordered" title="Numbered list"><i class="fa fa-list-ol"></i></button>
                <button type="button" data-cmd="quote" title="Quote"><i class="fa fa-quote-left"></i></button>
                <button type="button" data-cmd="codeblock" title="Code block"><i class="fa fa-file-code-o"></i></button>
                <button type="button" data-cmd="table" title="Table"><i class="fa fa-table"></i></button>
                <button type="button" data-cmd="hr" title="Horizontal line">—</button>
            </div>
            <div id="wikiCollabMount" class="wiki-collab-mount"
                 th:data-collab-js="@{/vendor/collab-editor/collab-editor.min.js}"
                 th:data-collab-css="@{/vendor/collab-editor/collab-editor.min.css}"
                 th:data-collab-base="${isNew} ? '' : @{/wiki/{wikiId}/page/{pageId}/collab(wikiId=${currentWiki.id},pageId=${pageId})}"
                 th:data-csrf-header="${_csrf.headerName}"
                 th:data-csrf-param="${_csrf.parameterName}"
                 th:data-csrf-token="${_csrf.token}"></div>

            <textarea id="wikiEditContent" name="content" hidden="hidden" th:text="${content}"></textarea>

            <div class="wiki-edit-actions">
                <button type="button" id="wikiEditSaveBtn" class="wiki-btn wiki-btn-primary"><i class="fa fa-check"></i> Save</button>
                <a th:if="${!isNew}" th:href="@{/wiki/{wikiId}/page/{pageId}(wikiId=${currentWiki.id},pageId=${pageId})}" class="wiki-btn">Cancel</a>
                <a th:if="${isNew}" th:href="@{/wiki/{wikiId}/(wikiId=${currentWiki.id})}" class="wiki-btn">Cancel</a>

                <!-- Moving a page is rare - a quiet link that reveals the folder select on demand
                     (see wiki.js). The select is in the form (and submits its pre-selected current
                     folder) whether revealed or not, so an untouched save never moves anything. -->
                <span class="wiki-move" th:if="${!isNew}">
                    <a href="#" id="wikiMoveToggle">Move to another folder&#8230;</a>
                    <span id="wikiMoveField" hidden="hidden">
                        <select id="wikiEditFolder" name="folderId">
                            <option value="">(top level)</option>
                            <option th:each="f : ${folderOptions}" th:value="${f.id}"
                                    th:text="${#strings.repeat('-- ', f.depth)} + ${f.name}"
                                    th:selected="${folderId != null and f.id == folderId}"></option>
                        </select>
                    </span>
                </span>
            </div>
        </form>
    </div>
</div>

<footer th:replace="layout :: site-footer" />
<script th:src="@{/script/wiki.js}"></script>
<script th:src="@{/script/wiki-collab.js}"></script>
</body>
</html>
