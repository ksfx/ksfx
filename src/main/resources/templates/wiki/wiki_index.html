<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: site-head">
    <title>KSFX - Wiki</title>
</head>
<body>
<link rel="stylesheet" th:href="@{/styles/wiki.css}" />
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item active" th:text="${currentWiki.name}">Wiki</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div class="wiki-layout" th:classappend="${#session?.getAttribute('ksfxdisplaymode') == 'dark'} ? ' wiki-dark' : ''">
    <div th:replace="wiki/wiki_tree :: sidebar"></div>

    <div class="wiki-main">
        <div class="wiki-empty" th:if="${pageCount == 0}">
            <p>This wiki is empty.</p>
            <!-- title=Home nudges toward the home-page convention: a top-level page titled "Home"
                 (slug home.md) becomes what /wiki/{id}/ lands on - see WikiController.index. -->
            <a th:href="@{/wiki/{wikiId}/page/new(wikiId=${currentWiki.id},title='Home')}" class="wiki-btn wiki-btn-primary">Create the first page</a>
        </div>
        <div class="wiki-empty" th:unless="${pageCount == 0}">
            <p>Pick a page from the tree, or create a new one.</p>
        </div>
    </div>
</div>

<footer th:replace="layout :: site-footer" />
<script th:src="@{/script/wiki.js}"></script>
</body>
</html>
