<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title>KSFX - API Clients</title>
</head>
<body>
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item active">API Clients</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div style="float:right">
    <a th:href="@{/apiclients/edit}" class="fa fa-plus fa-2x" title="Add New API Client" alt="Add New API Client"></a>&nbsp;&nbsp;&nbsp;
</div>
<table class="table table-striped table-responsive-md">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Enabled</th>
        <th>Created</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="apiClient : ${apiClients}">
        <td th:text="${apiClient.id}"></td>
        <td th:text="${apiClient.name}"></td>
        <td th:text="${apiClient.enabled} ? 'Yes' : 'No'"></td>
        <td th:text="${apiClient.createdAt}"></td>
        <td><a th:href="@{/apiclients/edit/{id}(id=${apiClient.id})}" class="fa fa-pencil" alt="Edit" title="Edit"></a></td>
        <td><a th:attr="data-href=@{/apiclients/delete/{id}(id=${apiClient.id})}" data-toggle="modal" data-target="#standard-confirm" class="fa fa-trash-o" alt="Delete" title="Delete"></a></td>
    </tr>
    </tbody>
</table>

<footer th:replace="layout :: site-footer" />
</body>
</html>
