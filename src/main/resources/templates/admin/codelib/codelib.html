<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title>KSFX - Code Libs</title>
</head>
<body>
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/}">Admin</a></li>
        <li class="breadcrumb-item active">Code Libs</li>
    </ol>
</nav>

<div th:if="${resultMessage}" th:classappend="${resultError} ? 'alert-danger' : 'alert-success'" class="alert" th:text="${resultMessage}"></div>

<div th:replace="components/pagination :: pagination(path='/admin/codelib/', page=${codeLibsPage})"></div>
<div style="float:right">
    <a th:href="@{/admin/codelib/edit}" class="fa fa-plus fa-2x" title="Add New Code Lib" alt="Add New Code Lib"></a>&nbsp;&nbsp;&nbsp;
</div>
<table class="table table-striped table-responsive-md">
    <thead>
    <header th:replace="components/sortable_table_header :: tableheader(headers=${ {'id','name','description','edit','delete'} },sortables=${ {'id','name'} },names=${ {'ID','Name','Description','Edit','Delete'} },page=${codeLibsPage},path='/admin/codelib/')" />
    </thead>
    <tbody>
    <tr th:each="codeLib : ${codeLibsPage.content}">
        <td th:text="${codeLib.id}"></td>
        <td th:text="${codeLib.name}"></td>
        <td th:text="${codeLib.description}"></td>
        <td><a th:href="@{/admin/codelib/edit/{id}(id=${codeLib.id})}" class="fa fa-pencil" alt="Edit" title="Edit"></a></td>
        <td><a th:attr="data-href=@{/admin/codelib/delete/{id}(id=${codeLib.id})}" data-toggle="modal" data-target="#standard-confirm" class="fa fa-trash-o" alt="Delete" title="Delete"></a></td>
    </tr>
    </tbody>
</table>

<form action="#" th:action="@{/admin/codelib/migratesqlwriter}" method="post">
    <button type="submit" class="btn btn-secondary">SQL-Writer aus NoteFile migrieren</button>
</form>

<footer th:replace="layout :: site-footer" />
</body>
</html>
