<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head th:replace="layout :: site-head">
    <title>KSFX - Generic Data Store</title>
</head>
<body>
<header th:replace="layout :: site-header"/>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a th:href="@{/admin/}">Admin</a></li>
        <li class="breadcrumb-item active">Generic Data Store</li>
    </ol>
</nav>
<h3>Persistent Store</h3>
<a th:href="@{/admin/genericdatastoreedit}" style="margin-top:10px" class="fa fa-plus" alt="Add Entry" title="Add Entry"></a>
<div th:replace="components/pagination :: pagination(path='/admin/genericdatastore/', page=${genericDataStoresPage})"></div>
<table class="table table-striped table-responsive-md">
    <thead>
    <header th:replace="components/sortable_table_header :: tableheader(headers=${ {'id','dataKey','dataValue','edit','delete'} },sortables=${ {'id','dataKey'} },names=${ {'ID','Data Key','Data Value','Edit','Delete'} },page=${genericDataStoresPage},path='/admin/genericdatastore/')" />
    </thead>
    <tbody>
    <tr th:each="genericDataStore : ${genericDataStoresPage.content}">
        <td th:text="${genericDataStore.id}"></td>
        <td th:text="${genericDataStore.dataKey}"></td>
        <!-- Values are LONGTEXT and may be secrets: keys that look like credentials (pass, secret,
             token, api_key, credential) are masked in the listing - the full value is still visible
             on the edit form - everything else is abbreviated so one huge value can't blow up the
             table. -->
        <td th:with="k=${genericDataStore.dataKey != null ? #strings.toLowerCase(genericDataStore.dataKey) : ''}"
            th:text="${#strings.contains(k,'pass') or #strings.contains(k,'secret') or #strings.contains(k,'token') or #strings.contains(k,'api_key') or #strings.contains(k,'apikey') or #strings.contains(k,'credential')} ? '••••••••' : ${#strings.abbreviate(genericDataStore.dataValue, 120)}"></td>
        <td><a th:href="@{/admin/genericdatastoreedit/{id}(id=${genericDataStore.id})}" class="fa fa-pencil" alt="Edit" title="Edit"></a></td>
        <td><a th:attr="data-href=@{/admin/genericdatastoredelete/{id}(id=${genericDataStore.id})}" data-toggle="modal" data-target="#standard-confirm" class="fa fa-trash-o" alt="Delete" title="Delete"></a></td>
    </tr>
    </tbody>
</table>
<h3>Non-Persistent Store</h3>
<table class="table table-striped table-responsive-md">
    <thead>
        <th>Key</th>
        <th>Value</th>
        <th>Delete</th>
    </thead>
    <tr th:each="entry : ${nonPersistentStore}">
        <td th:text="${entry.key}"></td>
        <td th:text="${entry.value}"></td>
        <td><a th:attr="data-href=@{/admin/nonpersistentstoredelete/{key}(key=${entry.key})}" data-toggle="modal" data-target="#standard-confirm" class="fa fa-trash-o" alt="Delete" title="Delete"></a></td>
    </tr>
</table>
<footer th:replace="layout :: site-footer" />
</body>
</html>
